#version: '3.1'

services:
  server:
    build:
      context: .
    image: spe-website:local
    container_name: website
    ports:
      - '4000:4000'
    environment:
      - TZ=America/New_York
      - JEKYLL_ENV=production
    volumes:
      - '.:/code'
    working_dir: /code
    command: >
      bundle exec jekyll serve --host 0.0.0.0 --force_polling
      --config _config.yml,_config_docker.yml